components:
  schemas:
    Geolocation:
      type: object
      properties:
        lat:
          type: number
          example: 19.0760
        lng:
          type: number
          example: 72.8777

    Address:
      type: object
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        street:
          type: string
          example: 123 Main St
        city:
          type: string
          example: Mumbai
        state:
          type: string
          example: Maharashtra
        pinCode:
          type: string
          example: '400001'
        addressType:
          type: string
          enum: [PERMANENT, CURRENT, BUSINESS, CORRESPONDENCE, OTHER]
          example: CURRENT
        country:
          type: string
          example: India
        landmark:
          type: string
          example: Mahim
        completeAddress:
          type: string
          example: 123 Main St, Mahim, Mumbai - 400001, India
        ownerType:
          type: string
          enum: [User, Vendor]
          description: Set by the server from the authenticated actor — not client input.
        owner:
          type: string
          description: User or Vendor document id, per ownerType. Set by the server.
        label:
          type: string
          enum: [Home, Work, Other]
          default: Other
        geolocation:
          $ref: '#/components/schemas/Geolocation'
        isDefault:
          type: boolean
          description: Exactly one address per (owner, ownerType) is default at a time.

    AddressInput:
      type: object
      required: [street, city, state, pinCode]
      properties:
        street:
          type: string
          example: 123 Main St
        city:
          type: string
          example: Mumbai
        state:
          type: string
          example: Maharashtra
        pinCode:
          type: string
          pattern: '^\d{6}$'
          example: '400001'
        addressType:
          type: string
          enum: [PERMANENT, CURRENT, BUSINESS, CORRESPONDENCE, OTHER]
          default: CURRENT
        country:
          type: string
          default: India
        landmark:
          type: string
          example: Mahim
        label:
          type: string
          enum: [Home, Work, Other]
          default: Other
        geolocation:
          $ref: '#/components/schemas/Geolocation'
      description: >
        Used for both create and update — update currently requires the full
        address (all required fields), not a partial patch. ownerType/owner are
        derived server-side from the authenticated caller and cannot be set here.

    AddressResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Address retrieved successfully
        data:
          $ref: '#/components/schemas/Address'

    AddressListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Addresses retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Address'

    AddressErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Address not found
