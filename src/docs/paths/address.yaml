create:
  post:
    summary: Create an address
    description: Any authenticated identity (user/vendor/admin) may create an address — e.g. to get an id to reference from KYC step 1.
    tags: [Address]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/address.yaml#/AddressInput'
    responses:
      '201':
        description: Address created
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'

byId:
  get:
    summary: Get an address by id
    tags: [Address]
    security:
      - bearerAuth: []
    parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Address found
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
      '404':
        description: Address not found (or addressId is not a valid ObjectId)
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'

  patch:
    summary: Update an address
    description: Replaces the address — requires the full set of required fields (street, city, state, pinCode), not a partial patch.
    tags: [Address]
    security:
      - bearerAuth: []
    parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/address.yaml#/AddressInput'
    responses:
      '200':
        description: Address updated
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
      '404':
        description: Address not found
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'

  delete:
    summary: Delete an address
    tags: [Address]
    security:
      - bearerAuth: []
    parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Address deleted
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
      '404':
        description: Address not found
        content:
          application/json:
            schema:
              $ref: '../schemas/address.yaml#/AddressErrorResponse'
