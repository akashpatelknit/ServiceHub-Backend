getStatus:
  get:
    summary: Get the authenticated vendor's KYC status
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current KYC record
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/KycResponse'
      '401':
        description: Not authenticated as a vendor
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '404':
        description: No KYC record yet (nothing submitted)
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

submitInfo:
  post:
    summary: 'KYC step 1: submit personal info'
    description: Vendor only. Creates the KYC record on first call (draft -> info_submitted).
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/KycInfoInput'
    responses:
      '200':
        description: Info submitted
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/KycResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Not a valid transition from the current KYC status
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

submitDocuments:
  post:
    summary: 'KYC step 2: submit identity documents'
    description: Vendor only. Requires status = info_submitted (info_submitted -> documents_submitted).
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/KycDocumentsInput'
    responses:
      '200':
        description: Documents submitted
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/KycResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '404':
        description: No KYC record yet — call step 1 first
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Not a valid transition from the current KYC status
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

submitBankDetails:
  post:
    summary: 'KYC step 3: submit bank details'
    description: Vendor only. Requires status = documents_submitted (documents_submitted -> bank_details_submitted).
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/KycBankDetailsInput'
    responses:
      '200':
        description: Bank details submitted
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/KycResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '404':
        description: No KYC record yet
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Not a valid transition from the current KYC status
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

initiatePayment:
  post:
    summary: 'KYC step 4a: create the KYC payment order'
    description: Vendor only. Requires status = bank_details_submitted. Creates a Razorpay order via the payment feature.
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/KycPaymentInitInput'
    responses:
      '201':
        description: Razorpay order created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../schemas/auth.yaml#/ApiSuccessResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../../schemas/auth.yaml#/KycPaymentOrder'
      '404':
        description: No KYC record yet
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Not a valid transition from the current KYC status
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

verifyPayment:
  post:
    summary: 'KYC step 4b: verify the KYC payment'
    description: >
      Vendor only. Verifies the Razorpay signature, then cascades
      payment_completed -> pending_verification in one step (no separate
      "submit for review" call).
    tags: [Vendor KYC]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/KycPaymentVerifyInput'
    responses:
      '200':
        description: Payment verified — KYC now pending_verification
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/KycResponse'
      '400':
        description: Invalid Razorpay signature
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '404':
        description: No KYC record, or no transaction found for this order
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Not a valid transition from the current KYC status
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
