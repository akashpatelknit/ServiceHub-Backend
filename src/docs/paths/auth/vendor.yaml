signup:
  post:
    summary: Create a vendor account (email/password)
    tags: [Vendor Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/SignupInput'
    responses:
      '201':
        description: Account created
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/TokenPairResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '409':
        description: Account already exists
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

login:
  post:
    summary: Log in a vendor
    tags: [Vendor Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/LoginInput'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/TokenPairResponse'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
      '403':
        description: Account is blocked
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

refresh:
  post:
    summary: Rotate an access/refresh token pair
    tags: [Vendor Authentication]
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/RefreshTokenInput'
    responses:
      '200':
        description: New token pair issued
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/TokenPairResponse'
      '401':
        description: Refresh token missing, invalid, expired, or reused
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

logout:
  post:
    summary: Log out (revokes the current access token)
    tags: [Vendor Authentication]
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logged out
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiSuccessResponse'
      '401':
        description: Access token missing, invalid, expired, or already revoked
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

forgotPassword:
  post:
    summary: Request a password reset token
    tags: [Vendor Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/ForgotPasswordInput'
    responses:
      '200':
        description: Always 200 — does not reveal whether the email is registered
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiSuccessResponse'

resetPassword:
  post:
    summary: Reset password using a reset token
    tags: [Vendor Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/ResetPasswordInput'
    responses:
      '200':
        description: Password reset — new token pair issued
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/TokenPairResponse'
      '400':
        description: Invalid or expired reset token
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'

changePassword:
  patch:
    summary: Change password while logged in
    tags: [Vendor Authentication]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/auth.yaml#/ChangePasswordInput'
    responses:
      '200':
        description: Password changed — client must log in again
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiSuccessResponse'
      '401':
        description: Not authenticated, or oldPassword incorrect
        content:
          application/json:
            schema:
              $ref: '../../schemas/auth.yaml#/ApiErrorResponse'
