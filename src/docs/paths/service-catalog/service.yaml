list:
  get:
    summary: List services
    description: Public. Level 4 (leaf) of the catalog hierarchy.
    tags: [Catalog Services]
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 20 }
      - name: category
        in: query
        description: Filter by ancestor Category id.
        schema: { type: string }
      - name: subcategory
        in: query
        description: Filter by ancestor Subcategory id.
        schema: { type: string }
      - name: serviceGroup
        in: query
        description: Filter by parent ServiceGroup id.
        schema: { type: string }
      - name: isActive
        in: query
        schema: { type: string, enum: ['true', 'false'] }
      - name: search
        in: query
        description: Full-text search over name/description.
        schema: { type: string }
    responses:
      '200':
        description: Paginated list of services
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ServiceListResponse'

  post:
    summary: Create a service
    description: Admin only. Price is fixed and set only here — vendors cannot set price.
    tags: [Catalog Services]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/serviceCatalog.yaml#/ServiceInput'
    responses:
      '201':
        description: Service created
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ServiceResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '404':
        description: Parent service group not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

byId:
  get:
    summary: Get a service by id
    description: Public.
    tags: [Catalog Services]
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Service found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ServiceResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

  patch:
    summary: Update a service
    description: Admin only. Partial update — at least one field required.
    tags: [Catalog Services]
    security:
      - bearerAuth: []
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/serviceCatalog.yaml#/ServiceUpdateInput'
    responses:
      '200':
        description: Service updated
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ServiceResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '404':
        description: Service (or new parent service group) not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

  delete:
    summary: Delete a service
    description: Admin only. Fails with 409 if the service has vendor requests or add-ons attached.
    tags: [Catalog Services]
    security:
      - bearerAuth: []
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Service deleted
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiSuccessResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '404':
        description: Service not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '409':
        description: Service has vendor requests or add-ons attached
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
