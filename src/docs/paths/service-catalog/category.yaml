list:
  get:
    summary: List categories
    description: Public. Level 1 of the catalog hierarchy.
    tags: [Catalog Categories]
    parameters:
      - name: page
        in: query
        schema: { type: integer, default: 1 }
      - name: limit
        in: query
        schema: { type: integer, default: 20 }
      - name: isActive
        in: query
        schema: { type: string, enum: ['true', 'false'] }
    responses:
      '200':
        description: Paginated list of categories
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/CategoryListResponse'

  post:
    summary: Create a category
    description: Admin only.
    tags: [Catalog Categories]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/serviceCatalog.yaml#/CategoryInput'
    responses:
      '201':
        description: Category created
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/CategoryResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

byId:
  get:
    summary: Get a category by id
    description: Public.
    tags: [Catalog Categories]
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Category found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/CategoryResponse'
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

  patch:
    summary: Update a category
    description: Admin only. Partial update — at least one field required.
    tags: [Catalog Categories]
    security:
      - bearerAuth: []
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../schemas/serviceCatalog.yaml#/CategoryUpdateInput'
    responses:
      '200':
        description: Category updated
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/CategoryResponse'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'

  delete:
    summary: Delete a category
    description: Admin only. Fails with 409 if the category still has subcategories.
    tags: [Catalog Categories]
    security:
      - bearerAuth: []
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Category deleted
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiSuccessResponse'
      '403':
        description: Not an admin
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '404':
        description: Category not found
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
      '409':
        description: Category still has subcategories
        content:
          application/json:
            schema:
              $ref: '../../schemas/serviceCatalog.yaml#/ApiErrorResponse'
